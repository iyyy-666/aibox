[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aibox-studio"
version = "0.1.0"
description = "RK3588人工智能实验箱学生编程平台"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7"]

[project.scripts]
aibox-studio = "aibox_studio.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
aibox_studio = [
    "resources/basic-ai/*.json",
    "resources/basic-ai/templates/*.py",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

