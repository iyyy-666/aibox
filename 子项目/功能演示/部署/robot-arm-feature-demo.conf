# Robot arm ownership for the unified feature demonstration.
#
# This file is declarative. Do not run the disable commands on a development
# machine. During deployment, first complete the feature-demo device checks
# with the unified application. Only then disable the legacy robot business
# autostart entry that owns /dev/esp32_arm, retaining its backup for rollback.

AIBOX_LEGACY_ROOT=/root/robot_arm
FEATURE_DEMO_ROBOT_ON_DEMAND=1

# The unified worker is the sole serial owner while robot_button or
# object_sorting is active. Legacy API modules remain imported through
# AIBOX_LEGACY_ROOT for backwards-compatible control actions.
